[[area]]
id = "packaging"
status = "implemented"
components = ["XnuPrelink"]
paths = ["scripts/package.sh", ".github/workflows/**", "patches/**"]
inputs = ["Pinned diagnostics downstream UniXNU commit 957405662863e484881992c815cfdb7a9dbd295a, official base 578ae75c8e7356d4d562bcfc294ab26dfe640a31, selected OS profile, private trust inputs and edk2-msm8998."]
configuration = ["board.toml fixes the downstream commit; the package script verifies HEAD, clean status and merge-base and runs only the unpinned output paths."]
procedure = ["Run release --check before the full package build."]
findings = ["The prelink tool moved from the fork-local NativePrelink path to the official XnuPrelink component ID.", "Eight reviewed downstream commits carry the UniXNU and DarwinBoot compatibility changes; package builds do not execute git apply or create a patched worktree.", "Device-local probes use a separate builder so they cannot shadow the canonical-aware official build-arm-driver script.", "Release external-firmware mode builds kernel, package and payload before the device script builds lss717/edk2-msm8998 and writes the final boot image and manifest.", "The manifest records downstream commit, official base, merge-base, source-tree digest, component revisions and the edk2 revision.", "The package script extracts the payload ADT and runs the full 47-check validation.", "DTB builds are byte-identical; kernel and FD rebuilds are byte-identical after enumerated identity, debug and build-time fields are normalized."]
completion = ["Clean fixed-commit packaging produces kernel, payload and boot image, leaves the UniXNU checkout clean, and records all source revisions in the manifest."]
limits = ["Reproducibility runs use test seed 0x12345678. The real-seed 128 MiB candidate reached RunXnu and Loader->Boot, then hit a UEFI synchronous exception before kernel handoff was proven."]
next_action = ["Add exception-register, image-base and DarwinBoot stage diagnostics without changing memory layout."]
evidence = [
  { kind = "host", reference = "docs/migration/reproducibility-2026-11-15.md", result = "Three clean downstream builds passed 47 ADT checks; normalized kernel and FD comparisons had zero byte differences.", command = "UNIXNU_UNIQUE_CHIP_ID=12345678 bash scripts/package.sh --os 17 --uefi ../edk2-msm8998", revision = "d7fafc5d45a795a3b7fc9e9ae313e704c5a1938e" },
  { kind = "host", reference = "docs/migration/clean-status.json", result = "Fresh downstream worktree without local.toml resolved 23 modules and 61 patches with zero local overrides; MSM8998 is pinned to 8227828e.", command = "unixnu fetch && unixnu status --json && unixnu tree", revision = "d7fafc5d45a795a3b7fc9e9ae313e704c5a1938e" },
]

