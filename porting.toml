[[area]]
id = "power"
status = "planned"
components = ["SoftwareAES"]
paths = ["dts/**", "drivers/**", "scripts/*pmgr*", "scripts/*power*"]
inputs = ["MSM8998 PMGR/RPM resources, USB/UFS rails and fixed firmware-managed power handoff."]
configuration = ["SoftwareAES is covered here as an OS-facing crypto service; its runtime implementation remains the official catalog component."]
procedure = ["Verify CPU, UFS and USB power domains independently before claiming suspend or resume."]
findings = ["The real sheng PMGR builder needs an existing prelinked kernel because it reads the ApplePMGR vtable.", "The initial format 2 kernel uses the existing PMGR stub; real PMGR integration belongs to a post-candidate rebuild."]
completion = ["Each claimed power transition restores dependent peripherals."]
