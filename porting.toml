  { kind = "device", reference = "docs/migration/device-run-2026-11-15-01.md", result = "Non-persistent fastboot boot of SHA-256 935a54dfe1afa622e4bfad6cdd9ed4cd8a04190fa9021d7f2cae7e3e1eb36c06 reached the UniXNU menu; IOS dispatch entered DarwinBoot, whose 4 GiB AllocateWindow failed with longest run 0xFCCD0000 at 0x01800000. No handoff or XNU evidence exists.", command = "fastboot boot op5-20261115-candidate/boot.img", revision = "85490ba682ab1e178a35f40fd80f42ea3aac08c9" },
  { kind = "device", reference = "docs/migration/device-run-2026-11-15-02.md", result = "Non-persistent boot of SHA-256 de86e1c2c773389bd1c3d23e0a5c275e2680607f8c712786f56f709aa2a1ea59 removed the old NO WINDOW failure, dispatched IOS and called Loader->Boot, then raised a synchronous UEFI exception at ELR 0x17ADBC378. Runtime image base and full exception context are not yet captured.", command = "fastboot boot op5-20261115-window128/boot.img", revision = "9c118c87bf56c4767ac6eeb6b7255a62efb3f8f6" },
