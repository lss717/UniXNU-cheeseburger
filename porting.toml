  { kind = "host", reference = "docs/migration/clean-status.json", result = "Fresh downstream worktree without local.toml resolved 23 modules and 61 patches with zero local overrides; MSM8998 is pinned to 8227828e.", command = "unixnu fetch && unixnu status --json && unixnu tree", revision = "d7fafc5d45a795a3b7fc9e9ae313e704c5a1938e" },
]

