configuration = ["The common DTSI exports ufshc and ufsphy; the board keeps the current probe and runtime archive entries."]
procedure = ["Run the four single-path UFS matrix configurations defined by the migration plan."]
findings = ["The diagnostic command line disables native-ufs-probe while its defconfig enables the probe.", "The signed-policy UFS runtime archive is removed from the initial format 2 baseline because CONFIG_XNU_NATIVE_UFS is not selected; this build is a negative control pending the UFS matrix.", "The PMGR stub explicitly returns native_ufs_store_mode 0, keeping NativeRamBlock volatile rather than implying persistent UFS.", "NativeRamBlock uses the existing 190-slot IOStorageFamily binding table and an explicit ml_static_mfree_prepare fallback."]
completion = ["Exactly one formal root storage path is selected and verified for read, write, flush, recovery and restart persistence."]
limits = ["The provider of the current root block device has not been isolated with the format 2 build."]
next_action = ["Run the A/B/C/D UFS matrix before attributing userland failures to storage."]
