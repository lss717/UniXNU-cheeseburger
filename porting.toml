schema_version = 1

[device]
name = "cheeseburger"
soc = "MSM8998"
os_profile = "ipados-17.7.11-21H461"
summary = "OnePlus 5 migrated to format 2 profiles and a board DTS; runtime and storage qualification remain pending."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "XnuPrelink"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", ".github/**", "local.toml.example"]
inputs = ["Preserve the measured OnePlus 5 values while selecting ARM64, MSM8998, iPadOS 17.7.11 and device profiles."]
configuration = ["board.toml uses schema_version 2, reports the MSM8998 common source and selects the pinned iPadOS profile."]
procedure = ["Run the official UniXNU defconfig, status and porting-record checks."]
findings = ["The format 1 resolver reported schema 1 with no components or patch order; the migration records that baseline before changing the board."]
completion = ["The official resolver reports schema 2, four profiles, nonempty components, ordered patches and the profile-qualified output path."]
limits = ["A successful parse is a host-side result and does not qualify a kernel or boot image on hardware."]
next_action = ["Use the fixed downstream source and clean status evidence for the real-seed hardware build."]
evidence = [
  { kind = "source", reference = "docs/migration/README.md", result = "Records the format 1 baseline, source revisions and the static migration scope." },
  { kind = "source", reference = "docs/migration/after-status.json", result = "Official resolver output reports schema 2, four profiles, seven components and sixty-one ordered patches." },
]

[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", ".github/workflows/package.yml"]
inputs = ["DarwinBoot is pinned to diagnostics revision 2bcbf057640a5e114dd04db3b3eba67cce4f7208; firmware comes from lss717/edk2-msm8998 f3ca800eaf67a0450ee3445560da463cc0eab05c."]
configuration = ["The payload keeps loader=firmware and the existing 76 MiB OP5ESP volume."]
procedure = ["Build the firmware with edk2-msm8998, then package it with the format 2 payload and boot image steps."]
findings = ["The downstream UniXNU branch pins a DarwinBoot build-compatibility commit based directly on official 5243c68e.", "CLANG38 plus LLVM 20 built the FD and the device script assembled the payload into a checked boot image.", "Repeated FD builds differ only in the embedded __TIME__ string.", "The in-memory serial buffer at A1A10000+0x200000 was mapped uncached but remained in the conventional RAM description; f3ca800e reserves it so DarwinBoot cannot receive it in a kernel window."]
completion = ["FD, payload and boot image build from pinned inputs; repeated builds are code-equivalent after enumerated build-time fields are normalized."]
limits = ["The _arm_vm_init reset probe was verified in the final payload but did not reset. Combined with the prior post-MMU proof, the unresolved boundary is the return from common_start into _arm_init and the later _arm_init call to _arm_vm_init."]
next_action = ["Boot the prepared single-point _arm_init entry-reset probe with SHA-256 4eb2ddd6c4ba747d13ad1b9758a3500f98d122c60cf1136c361e01ec805be00c after manual return to TWRP, then record whether it immediately resets."]
evidence = [
  { kind = "host", reference = "docs/migration/reproducibility-2026-11-15.md", result = "Three clean FD builds passed structure checks; raw differences were limited to __TIME__ and normalized to zero bytes.", command = "scripts/package.sh --os 17 --uefi ../edk2-msm8998", revision = "d7fafc5d45a795a3b7fc9e9ae313e704c5a1938e" },
]

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu"]
paths = ["dts/**", "drivers/**"]
inputs = ["Eight MSM8998 MPIDR values, 19.2 MHz timebase and PSCI SMC from the Linux MSM8998 and OnePlus 5 device trees."]
configuration = ["The common DTSI uses qcom,kryo280 for all eight CPUs, preserves MPIDR 0..3 and 0x100..0x103, and keeps explicit P/E cluster tags."]
procedure = ["Compile the board DTS, generate the ADT and boot with one CPU before enabling all cores."]
findings = ["ArmCpu consumes unixnu,cluster-type and does not depend on the CPU compatible string.", "The ADT checker covers all eight compatible strings, MPIDR values, P/E tags and the 19.2 MHz timebase.", "The current diagnostic command line still uses cpus=1 while the ADT declares all eight CPUs."]
completion = ["Every enabled CPU starts and timer/IPI handling is verified on hardware."]
limits = ["Only host-side DTS and ADT evidence exists; CPU topology and PSCI have not been re-qualified against the format 2 image."]
next_action = ["Boot one CPU first, then add the second core and both clusters with separate hardware evidence."]
evidence = [
  { kind = "source", reference = "feeds.toml", result = "The pinned UniXNU-msm8998-common dts/msm8998.dtsi uses qcom,kryo280 for all eight CPUs while retaining P/E cluster tags.", revision = "8227828eb1706b51aea9762bd46006328d91db26" },
  { kind = "host", reference = "scripts/check-format2-adt.py", result = "The format 2 ADT check verifies eight Kryo 280 compatible strings, MPIDR order, P/E tags and timebase.", command = "scripts/check-format2-adt.py --adt kernel.macho.adt", revision = "d7fafc5d45a795a3b7fc9e9ae313e704c5a1938e" },
]

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**"]
inputs = ["8 GiB installed RAM at 0x80000000, a 4 GiB DarwinBoot window and the measured framebuffer, ramoops, IPA and ZAP reservations."]
configuration = ["cheeseburger.dts declares one contiguous 8 GiB memory node and board-owned reserved-memory ranges."]
procedure = ["Compare generated ADT memory properties with the format 1 ADT before booting."]
findings = ["The common generator derives one arm-io window from exported hardware registers; the new UFS range lowers that window below the old 0x17000000 base.", "The first hardware dispatch requested 0x100000000 bytes, while DarwinBoot found a 0xFCCD0000-byte longest run at 0x01800000 and returned EFI_OUT_OF_RESOURCES.", "Historical H236br-H236bu measurements showed 256 MiB AllocatePages calls fail while 128 MiB succeeds. The candidate's known payload files total 56,492,228 bytes, leaving 77,725,500 bytes inside a 128 MiB window before alignment and early VM reserve.", "The second candidate removed the NO WINDOW text but stopped in a synchronous UEFI exception at ELR 0x17ADBC378 after RunXnu called the loader."]
completion = ["Memory map, arm-io translation and all reserved ranges match the bootloader inventory."]
limits = ["The generated format 2 ADT has not been compared byte-for-byte with the format 1 ADT.", "The current 4 GiB request cannot be satisfied by the measured UEFI memory map."]
next_action = ["Build the second candidate with owned_memory_size 0x08000000 and verify the generated ADT before retesting."]
evidence = []

[[area]]
id = "storage"
status = "planned"
components = ["RamBlock"]
paths = ["configs/**", "drivers/**", "scripts/*ufs*", "scripts/*storage*", "dts/**"]
inputs = ["UFS HC 0x1da4000, PHY 0x1da7000, SPI 265, 4096-byte logical blocks, a 64 GiB Android ext4 userdata partition and a separate 49.212 GiB userdata_ios SHNGROOT target."]
configuration = ["The common DTSI exports ufshc and ufsphy; the board keeps the current probe and runtime archive entries.", "RootLayout selects userdata_ios by GPT name; board.toml uses the schema's [userdata] table for userdata_ios geometry only."]
procedure = ["Run the four single-path UFS matrix configurations defined by the migration plan."]
findings = ["The diagnostic command line disables native-ufs-probe while its defconfig enables the probe.", "The signed-policy UFS runtime archive is removed from the initial format 2 baseline because CONFIG_XNU_NATIVE_UFS is not selected; this build is a negative control pending the UFS matrix.", "The PMGR stub explicitly returns native_ufs_store_mode 0, keeping NativeRamBlock volatile rather than implying persistent UFS.", "NativeRamBlock uses the existing 190-slot IOStorageFamily binding table and an explicit ml_static_mfree_prepare fallback.", "The phone no longer has one combined userdata range: sda13 is the Android 64 GiB ext4 /data volume and sda14 is userdata_ios at LBA 0x1014F40..0x1C627FA."]
completion = ["Exactly one formal root storage path is selected and verified for read, write, flush, recovery and restart persistence."]
limits = ["The provider of the current root block device has not been isolated with the format 2 build."]
next_action = ["Run the A/B/C/D UFS matrix before attributing userland failures to storage."]
evidence = []

[[area]]
id = "display"
status = "planned"
components = []
paths = ["dts/**", "drivers/**", "scripts/*display*", "scripts/*gop*"]
inputs = ["GOP framebuffer at 0x9d400000, 1080x1920, stride 4320 bytes and BGRX pixels."]
configuration = ["The board DTS describes the simple framebuffer and reserved region."]
procedure = ["Verify early XNU console output first, then the userland display component."]
findings = ["The earlier device claim that root mounted and launchd executed does not establish a usable compositor or first frame."]
completion = ["Known content appears with correct geometry, then the native display stack presents frames."]
limits = ["No display path is qualified by this format 2 migration."]
next_action = ["Capture the first post-migration kernel console checkpoint."]
evidence = []

[[area]]
id = "input"
status = "planned"
components = []
paths = ["dts/**", "drivers/**", "scripts/*input*", "scripts/*button*"]
inputs = ["Power and volume keys in the button set; the board has no mechanical Home button."]
configuration = ["The board ADT declares hold, voldown and volup with home-button-type 2."]
procedure = ["Confirm UEFI key handling, then validate the native HID path separately."]
findings = ["The format 1 ADT button values are preserved in typed format 2 tables."]
completion = ["Buttons produce stable HID events and touch works after a native input component is selected."]
limits = ["No native touch component is selected in the initial format 2 set."]
next_action = ["Keep UEFI and native input evidence separate."]
