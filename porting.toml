inputs = ["Migration baseline JSON, preserved format 1 board file and existing device diagnostics."]
configuration = ["AppleKeyStoreState is selected because the current diagnostic path publishes the key-store service before userland startup."]
procedure = ["Attach status JSON, build logs, image hashes and hardware checkpoints as separate evidence."]
findings = ["The current kernel arguments still bypass root, AMFI and execution signature checks and enable a debug path."]
completion = ["Every claimed checkpoint points to an image hash, source revision and raw log or photograph."]
limits = ["The real-seed 128 MiB candidate reached RunXnu and Loader->Boot, then raised a synchronous UEFI exception at ELR 0x17ADBC378. The exact image base, ESR, FAR and substage are missing; handoff and XNU remain unverified."]
next_action = ["Capture full AArch64 exception context and DarwinBoot stage markers before changing functional code."]
