[[area]]
id = "gpu"
status = "planned"
components = []
paths = ["dts/**", "drivers/**", "scripts/*gpu*", "scripts/*adreno*"]
inputs = ["Adreno 540, A540 firmware, GPU reserved memory and power sequencing."]
configuration = ["The initial component set does not select an official MSM8998 GPU implementation."]
procedure = ["Select a catalog implementation only after its MSM8998 resource and ABI requirements are documented."]
findings = ["SM8550 Adreno740 is not a substitute for an Adreno 540 implementation."]
completion = ["A known GPU submission completes and a frame is presented."]
limits = ["GPU work is outside the first static migration."]
next_action = ["Inventory the existing A540 probe and decide whether it becomes a device component or a shared component."]
