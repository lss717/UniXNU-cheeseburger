  { kind = "device", reference = "docs/migration/device-run-2026-11-16-01.md", result = "Non-persistent boot of SHA-256 2f1761df0784061c15e7efb2f4bf3f74baa1144116553619cdcc36c01f0605d7 passed kernel, ADT, video and command-line checks. A green DarwinEnter band proved ExitBootServices success, then the panel went black. XNU entry and post-MMU execution remain unproven; an entry-probe candidate is built.", command = "fastboot boot op5-20261115-diag-bufferfix/boot.img", revision = "02abd3496ed0f6c1b1e63e81162d593fe2ee64a0" },
