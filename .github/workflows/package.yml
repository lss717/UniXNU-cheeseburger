name: package

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["17"]
        default: "17"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: lss717/UniXNU
          ref: 957405662863e484881992c815cfdb7a9dbd295a
          path: references/UniXNU
          submodules: recursive
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: lss717/edk2-msm8998
          ref: f74be2e40fdbdee57e6065adbdc0cf23cb3653dd
          path: uefi-msm8998
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools blacktop/tap/ipsw
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set UNIXNU_UNIQUE_CHIP_ID to the device platform seed.' >&2
            exit 1
          fi
      - name: private inputs
        env:
          TRUST_CACHE_URL: ${{ secrets.UNIXNU_TRUST_CACHE_URL }}
          DATA_RAMDISK_URL: ${{ secrets.UNIXNU_DATA_RAMDISK_URL }}
          DATA_RAMDISK_SHA256: ${{ secrets.UNIXNU_DATA_RAMDISK_SHA256 }}
        run: |
          test -n "$TRUST_CACHE_URL"
          test -n "$DATA_RAMDISK_URL"
          test -n "$DATA_RAMDISK_SHA256"
          curl -fL --retry 3 "$TRUST_CACHE_URL" -o "$RUNNER_TEMP/kernel.macho.trustcache"
          curl -fL --retry 3 "$DATA_RAMDISK_URL" -o "$RUNNER_TEMP/data-seed.dbr"
          echo "$DATA_RAMDISK_SHA256  $RUNNER_TEMP/data-seed.dbr" | shasum -a 256 -c -
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          UNIXNU_TRUST_CACHE: ${{ runner.temp }}/kernel.macho.trustcache
          UNIXNU_DATA_RAMDISK: ${{ runner.temp }}/data-seed.dbr
          UNIXNU_SKIP_SETUP: 1
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/package.sh --os "${{ inputs.os }}" --uefi ../uefi-msm8998
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            references/UniXNU/out/cheeseburger/*/*/boot/boot.img
            references/UniXNU/out/cheeseburger/*/*/boot/boot.json
            references/UniXNU/out/cheeseburger/*/*/payload/payload.img
            references/UniXNU/out/cheeseburger/*/*/kernel/kernel.macho
            references/UniXNU/out/cheeseburger/*/*/package.manifest.json
            uefi-msm8998/workspace/Build/cheeseburger/RELEASE_CLANG38/FV/MSM8998PKG_UEFI.fd
