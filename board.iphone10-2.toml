# Target profile for B6: iPhone10,2 / iOS 16.7.16 (20H392).
#
# This file is kept next to board.toml so the B6 switch is a reviewable diff, not a rewrite.
# Nothing here is used by the B1-B5 builds yet.  TODO(B6): fill the IPSW url and hashes, the
# prelink inputs from the 20H392 kernelcache, the D21AP /product and /buttons trees, and the
# userdata window sizes of the iOS 16 restore.

[board]
name = "cheeseburger-iphone10-2"
soc = "MSM8998"
description = "OnePlus 5 as iPhone10,2"
kit = "cheeseburger"

[ipsw]
# TODO(B6): URL of iPhone10,2 16.7.16 (20H392), verified by SHA-256.
product = "iPhone10,2"
version = "16.7.16"
build = "20H392"
device_class = "d21ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[userdata]
first_lba = 0x14f40
last_lba = 0x1c627fa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "cheeseburger_defconfig"

[kernel.prelink]
tool = "kits/NativePrelink/emit_prelink.py"
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
slide = "-0x1000000"
roots = []

[payload]
volume = "OP5ESP"
size_mib = 64
loader = "firmware"
title = "OnePlus 5 D21AP"
dram_size = "0xF0000000"
kernel_args = ["-v", "debug=0x14e", "boot-progress=2"]

[payload.adt]
tool = "scripts/make-cheeseburger-adt.py"
cpu_regs = "0,1,2,3,0x100,0x101,0x102,0x103"
owned_memory_size = "0x200000000"
ipad_identity = false
